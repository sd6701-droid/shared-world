<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lingbot-World-2 live demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0d10; color: #e7ecef;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { padding: 10px 16px; border-bottom: 1px solid #1d2329; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  #status { color: #8aa0ad; }
  #status.err { color: #ff6b6b; }
  #status.ok { color: #3ddc84; }
  main { flex: 1; display: grid; place-items: center; padding: 16px; }
  .stage { position: relative; width: min(100%, 1040px); aspect-ratio: 1664 / 960; background: #000; border: 1px solid #1d2329; border-radius: 10px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #8aa0ad; }
  .overlay.hidden { display: none; }
  footer { padding: 10px 16px; border-top: 1px solid #1d2329; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=text] { flex: 1; min-width: 240px; background: #11151a; border: 1px solid #263038; color: #e7ecef; padding: 8px 10px; border-radius: 7px; }
  button { background: #1b2026; border: 1px solid #2b353d; color: #e7ecef; padding: 8px 14px; border-radius: 7px; cursor: pointer; }
  button:hover { background: #222a31; }
  kbd { background: #11151a; border: 1px solid #2b353d; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font: inherit; }
  .hint { color: #6b7d88; }
</style>
</head>
<body>
  <header>
    <h1>Lingbot-World-2 · live view</h1>
    <span id="status">idle</span>
  </header>

  <main>
    <div class="stage">
      <video id="out" autoplay playsinline muted></video>
      <div class="overlay" id="overlay">
        <div>
          <div style="font-size:18px;margin-bottom:8px">door opening…</div>
          <div class="hint">seeding the world with <code id="seedName">angle_05.jpg</code></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <select id="agent" title="whose first-person view">
      <option value="plain">Plain first-person</option>
      <option value="goggles">Goggles (night-vision)</option>
      <option value="cameras">Cameras (CCTV)</option>
    </select>
    <select id="seedSel" title="starting view of the room (one of your 50 images)"></select>
    <input id="prompt" type="text" value="a closed, windowless room with plain grey walls, a dark wooden floor, a ceiling light panel, and one wooden table with a small white vase in the center, no people" />
    <button id="connect">Connect & start</button>
    <span class="hint">move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · look: <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span>
  </footer>

<script type="module">
  import { Reactor } from 'https://esm.sh/@reactor-team/js-sdk';

  const video = document.getElementById('out');
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const promptEl = document.getElementById('prompt');
  const agentEl = document.getElementById('agent');
  const connectBtn = document.getElementById('connect');

  function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }

  // 5 views of the room, all from the same eye-level ring (1.5 m high, 3.6 m from the
  // table) so every world starts at the same height/distance. Images: demo-live/rooms50/.
  const VIEWS = [
    ['angle_05.jpg', 'front (0°)'],
    ['angle_03.jpg', 'front-left (−32°)'],
    ['angle_07.jpg', 'front-right (+32°)'],
    ['angle_01.jpg', 'left side (−70°)'],
    ['angle_09.jpg', 'right side (+70°)'],
  ];
  const seedSel = document.getElementById('seedSel');
  VIEWS.forEach(([f, label], i) => seedSel.add(new Option(label, f, i === 0, i === 0)));
  seedSel.addEventListener('change', () => { document.getElementById('seedName').textContent = seedSel.value; });

  // First-person lenses. Kept in sync with lib/agents/*.ts — every option is
  // explicitly first-person / eye-level so the agent always sees from their own
  // point of view.
  const LENSES = {
    plain: 'first person, eye-level camera, photorealistic',
    goggles: 'night-vision goggles view, monochrome green, bright center, dark vignette edges, slight grain, first person',
    cameras: 'security camera footage, black and white, grainy, high corner angle, slight fisheye, timestamp overlay style, first person',
  };

  // Compose the full prompt: the scene + the selected agent's first-person lens.
  const buildPrompt = () => `${promptEl.value}, ${LENSES[agentEl.value] || LENSES.plain}`;

  let reactor = null;

  async function run() {
    connectBtn.disabled = true;
    setStatus('fetching seed image…');
    const seedFile = document.getElementById('seedSel').value;
    document.getElementById('seedName').textContent = seedFile;
    const blob = await (await fetch('/rooms50/' + seedFile)).blob();
    const seed = new File([blob], seedFile, { type: 'image/jpeg' });

    reactor = new Reactor({ modelName: 'reactor/lingbot-world-2' });

    reactor.on('trackReceived', (name, track, stream) => {
      if (name !== 'main_video') return;
      video.srcObject = stream;
      void video.play();
      overlay.classList.add('hidden');
      setStatus('streaming — walk with WASD', 'ok');
    });

    reactor.on('statusChanged', async (status) => {
      setStatus('session: ' + status);
      if (status !== 'ready') return;
      try {
        setStatus('uploading seed image…');
        const ref = await reactor.uploadFile(seed);
        await reactor.sendCommand('set_image', { image: ref });
        await reactor.sendCommand('set_prompt', { prompt: buildPrompt() });
        await reactor.sendCommand('start', {});
        setStatus('generation starting…');
      } catch (e) {
        setStatus('command failed: ' + (e?.message || e), 'err');
      }
    });

    setStatus('minting token…');
    const tok = await (await fetch('/api/token', { method: 'POST' })).json();
    if (tok.error) { setStatus('token error: ' + tok.error, 'err'); connectBtn.disabled = false; return; }

    // LingBot capacity is shared; a busy pool returns 429 "no available capacity".
    // Show the real reason and retry instead of silently sitting at "disconnected".
    const MAX_TRIES = 24, WAIT_S = 5;
    for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
      try {
        setStatus(attempt === 1 ? 'connecting…' : `connecting… (try ${attempt}/${MAX_TRIES})`);
        await reactor.connect(tok.jwt);
        return;
      } catch (e) {
        const msg = String(e?.message || e);
        const busy = /capacity|busy|429|rate.?limit/i.test(msg);
        if (!busy || attempt === MAX_TRIES) {
          setStatus('connect failed: ' + msg, 'err');
          connectBtn.disabled = false;
          return;
        }
        for (let s = WAIT_S; s > 0; s--) {
          setStatus(`LingBot servers are all busy (Reactor capacity) — retrying in ${s}s… (try ${attempt}/${MAX_TRIES})`, 'err');
          await new Promise((r) => setTimeout(r, 1000));
        }
      }
    }
  }

  connectBtn.addEventListener('click', run);

  // Switch the first-person lens live (no reconnect needed).
  agentEl.addEventListener('change', () => {
    if (reactor) reactor.sendCommand('set_prompt', { prompt: buildPrompt() }).catch(() => {});
  });

  // ---- WASD movement + arrow-key look (each value persists until changed) ----
  const send = (name, payload) => reactor && reactor.sendCommand(name, payload).catch(() => {});
  const down = new Set();
  function apply() {
    send('set_move_longitudinal', { move_longitudinal: down.has('w') ? 'forward' : down.has('s') ? 'back' : 'idle' });
    send('set_move_lateral', { move_lateral: down.has('a') ? 'strafe_left' : down.has('d') ? 'strafe_right' : 'idle' });
    send('set_look_horizontal', { look_horizontal: down.has('ArrowLeft') ? 'left' : down.has('ArrowRight') ? 'right' : 'idle' });
    send('set_look_vertical', { look_vertical: down.has('ArrowUp') ? 'up' : down.has('ArrowDown') ? 'down' : 'idle' });
  }
  const KEYS = new Set(['w', 'a', 's', 'd', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
  window.addEventListener('keydown', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!KEYS.has(k)) return;
    e.preventDefault();
    if (!down.has(k)) { down.add(k); apply(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!KEYS.has(k)) return;
    down.delete(k); apply();
  });

  // tidy teardown so a session never leaks (bills per second while open)
  window.addEventListener('pagehide', () => { try { reactor && reactor.disconnect(); } catch {} });
</script>
</body>
</html>
